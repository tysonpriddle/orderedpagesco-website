<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#1E2D3D"/>

  <!-- Decorative gold border inset -->
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="#B8895A" stroke-width="6" opacity="0.6"/>

  <!-- Stylised page stack (3 pages, offset) -->
  <!-- Back page -->
  <rect x="172" y="148" width="196" height="248" rx="12" fill="#2A3F56" stroke="#B8895A" stroke-width="3"/>
  <!-- Middle page -->
  <rect x="158" y="136" width="196" height="248" rx="12" fill="#2A3F56" stroke="#B8895A" stroke-width="3"/>
  <!-- Front page -->
  <rect x="144" y="124" width="196" height="248" rx="12" fill="#F7F4EF"/>

  <!-- Lines on front page -->
  <rect x="172" y="174" width="112" height="6" rx="3" fill="#B8895A" opacity="0.9"/>
  <rect x="172" y="200" width="136" height="4" rx="2" fill="#1E2D3D" opacity="0.25"/>
  <rect x="172" y="218" width="124" height="4" rx="2" fill="#1E2D3D" opacity="0.25"/>
  <rect x="172" y="236" width="130" height="4" rx="2" fill="#1E2D3D" opacity="0.25"/>
  <rect x="172" y="254" width="116" height="4" rx="2" fill="#1E2D3D" opacity="0.25"/>
  <rect x="172" y="272" width="128" height="4" rx="2" fill="#1E2D3D" opacity="0.25"/>

  <!-- OP monogram bottom of front page -->
  <text x="242" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#B8895A" letter-spacing="4">OP</text>
</svg>
