<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordered Pages Co — Printable Planners & Trackers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1D1A13;
      color: #F7F4EF;
      font-family: Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .monogram {
      width: 80px;
      height: 80px;
      border: 1px solid rgba(184,137,90,0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      letter-spacing: 2px;
      margin: 0 auto 32px;
      color: #F7F4EF;
    }
    h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 400;
      letter-spacing: 4px;
      margin-bottom: 16px;
    }
    .rule {
      width: 60px;
      height: 1px;
      background: #B8895A;
      margin: 20px auto;
      opacity: 0.6;
    }
    p {
      font-family: Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 40px;
    }
    a.cta {
      display: inline-block;
      border: 1px solid rgba(184,137,90,0.6);
      color: #B8895A;
      text-decoration: none;
      padding: 14px 36px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    a.cta:hover { background: rgba(184,137,90,0.08); }
    footer {
      position: fixed;
      bottom: 20px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      opacity: 0.3;
    }
    footer a { color: #F7F4EF; }
  </style>
</head>
<body>
  <div class="monogram">OP</div>
  <h1>Ordered Pages Co</h1>
  <div class="rule"></div>
  <p>Instant Download Printables</p>
  <a class="cta" href="https://www.etsy.com/au/shop/OrderedPagesCo">Shop on Etsy</a>
  <footer><a href="/privacy.html">Privacy Policy</a></footer>
</body>
</html>
